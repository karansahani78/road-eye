server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: roadeye
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/roadeye}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:karan143}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: roadeye-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: com.roadeye.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    async:
      request-timeout: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:roadeye-evidence}

jwt:
  secret: ${JWT_SECRET:iofsdafijaifadsifjawpiojrew3w242342oipkofksajdf=}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

geocoding:
  provider: ${GEOCODING_PROVIDER:nominatim}
  nominatim:
    endpoint: ${NOMINATIM_ENDPOINT:https://nominatim.openstreetmap.org}
    user-agent: ${NOMINATIM_USER_AGENT:RoadEye/1.0}
    rate-limit-ms: 1100

kafka:
  topics:
    camera-health: camera-health
    vehicle-observations: vehicle-observations
    plate-recognitions: plate-recognitions
    speed-estimations: speed-estimations
    violation-candidates: violation-candidates
    evidence-created: evidence-created
    incident-events: incident-events

logging:
  level:
    com.roadeye: DEBUG
    org.springframework.security: INFO
    org.springframework.kafka: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
    kafka:
      enabled: true
