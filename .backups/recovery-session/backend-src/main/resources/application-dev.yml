spring:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    com.roadeye: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.apache.kafka: DEBUG

server:
  port: 8080
