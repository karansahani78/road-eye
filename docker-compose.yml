services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: roadeye-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: roadeye
      POSTGRES_USER: roadeye
      POSTGRES_PASSWORD: roadeye_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadeye -d roadeye"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadeye-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: roadeye-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - roadeye-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: roadeye-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      - zookeeper
    networks:
      - roadeye-network

  minio:
    image: minio/minio:latest
    container_name: roadeye-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: roadeye
      MINIO_ROOT_PASSWORD: roadeye_dev
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadeye-network

  backend:
    build:
      context: ./backend
    container_name: roadeye-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/roadeye
      SPRING_DATASOURCE_USERNAME: roadeye
      SPRING_DATASOURCE_PASSWORD: roadeye_dev
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: roadeye
      MINIO_SECRET_KEY: roadeye_dev
      JWT_SECRET: change-this-to-a-secure-random-secret-in-production
      JWT_EXPIRATION: 86400000
      AI_SERVICE_URL: http://ai-engine:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - roadeye-network

  ai-engine:
    build:
      context: ./ai-engine
    container_name: roadeye-ai-engine
    ports:
      - "8000:8000"
    volumes:
      - ./ai-engine/models:/app/models
      - ./ai-engine/videos:/app/videos
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/health | grep -q healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - roadeye-network

  frontend:
    build:
      context: ./frontend
    container_name: roadeye-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000 | grep -q root || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - roadeye-network

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local

networks:
  roadeye-network:
    driver: bridge
